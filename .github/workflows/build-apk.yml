name: Build Olamilekan Football APK

on:workflow_dispatch:push:-branches:
main

jobs:build:runs-on: ubuntu-22.04

steps:
  - name: Download game files
    uses: actions/checkout@v4

  - name: Check project files
    run: |
      echo "Current directory:"
      pwd
      echo "Files in project root:"
      ls -la
      echo "Searching for Godot project files:"
      find . -name project.godot -o -name export_presets.cfg

  - name: Install Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android Build Tools
    run: |
      sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

  - name: Install Godot
    run: |
      wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
      unzip -q /tmp/godot.zip -d /tmp/godot
      sudo install /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
      godot --version

  - name: Install Godot Android Export Templates
    run: |
      mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
      wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/godot-templates.tpz
      mkdir -p /tmp/godot-templates
      unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
      cp /tmp/godot-templates/templates/android_debug.apk "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      cp /tmp/godot-templates/templates/android_release.apk "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

  - name: Create debug keystore
    run: |
      mkdir -p "$HOME/.android"
      keytool -genkeypair -v \
        -keystore "$HOME/.android/debug.keystore" \
        -storepass android \
        -alias androiddebugkey \
        -keypass android \
        -dname "CN=Android Debug,O=Android,C=US" \
        -keyalg RSA \
        -keysize 2048 \
        -validity 10000

  - name: Build Android APK
    run: |
      mkdir -p build
      godot --headless --path . --editor --quit
      godot --headless --path . --export-debug "Android" build/OlamilekanFootball.apk

  - name: Save APK
    uses: actions/upload-artifact@v4
    with:
      name: Olamilekan-Football-APK
      path: build/OlamilekanFootball.apk
      if-no-files-found: error
